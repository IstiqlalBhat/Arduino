<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOBY // CYBERWATCH_2077</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Import Maps for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
</head>

<body>
  <!-- Atmospheric Rain Layer -->
  <canvas id="rain-canvas"></canvas>
  
  <!-- Scanline Overlay -->
  <div class="global-scanlines"></div>
  
  <!-- Vignette -->
  <div class="vignette"></div>
  
  <!-- Chromatic Aberration Overlay -->
  <div class="chromatic-layer"></div>

  <!-- 3D Containers -->
  <div id="webgl-container"></div>
  <div id="css3d-container"></div>

  <!-- HUD Corner Elements -->
  <div class="hud-corner top-left">
    <div class="hud-bracket"></div>
    <div class="hud-text">
      <span class="blink">●</span> NEURAL_LINK::ACTIVE
      <br>
      <span class="dim">LAT: 52.2297° N</span>
      <br>
      <span class="dim">LON: 21.0122° E</span>
    </div>
  </div>

  <div class="hud-corner top-right">
    <div class="hud-bracket flip"></div>
    <div class="hud-text right">
      <span id="hud-time">00:00:00</span>
      <br>
      <span class="dim" id="hud-date">2077.12.05</span>
      <br>
      <span class="status-ok">▲ UPLINK OK</span>
    </div>
  </div>

  <div class="hud-corner bottom-left">
    <div class="hud-bracket flip-v"></div>
    <div class="hud-stats">
      <div class="stat-row">
        <span>CPU</span>
        <div class="stat-bar"><div class="stat-fill" id="cpu-bar" style="width:45%"></div></div>
        <span id="cpu-val">45%</span>
      </div>
      <div class="stat-row">
        <span>MEM</span>
        <div class="stat-bar"><div class="stat-fill" id="mem-bar" style="width:62%"></div></div>
        <span id="mem-val">62%</span>
      </div>
      <div class="stat-row">
        <span>NET</span>
        <div class="stat-bar"><div class="stat-fill neon" id="net-bar" style="width:88%"></div></div>
        <span id="net-val">88%</span>
      </div>
    </div>
  </div>

  <div class="hud-corner bottom-right">
    <div class="hud-bracket flip-both"></div>
    <div class="mini-console" id="mini-log">
      <div class="log-entry">> SYS_INIT</div>
    </div>
  </div>

  <!-- Interaction hints removed - buttons are on the 3D watch -->

  <!-- Floating Hex Grid Background -->
  <div class="hex-background" id="hex-grid"></div>

  <!-- The DOM Element to be embedded in the 3D Watch Screen -->
  <div id="terminal-source">
    <div class="crt-container">
      <div class="crt-glare"></div>
      <div class="scanline"></div>
      <div class="noise-overlay"></div>
      <div class="terminal-header">
        <div class="header-left">
          <span class="header-icon">◈</span>
          <span class="header-title">TOBY_WATCH_OS</span>
        </div>
        <div class="header-right">
          <span class="header-status" id="connection-status">● CONNECTED</span>
        </div>
      </div>
      <div class="terminal-divider"></div>
      <div id="terminal">
        <!-- Log output -->
      </div>
      <div class="input-area">
        <div class="input-glow"></div>
        <span class="prompt" id="prompt-label">BOOTING...</span>
        <input type="text" id="command-input" autocomplete="off" spellcheck="false" disabled>
        <div class="cursor-block"></div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        <span class="glitch" data-text="INITIALIZING">INITIALIZING</span>
      </div>
      <div class="loading-bar">
        <div class="loading-progress" id="loading-progress"></div>
      </div>
      <div class="loading-status" id="loading-status">Loading neural pathways...</div>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="sfx-keystroke" preload="auto"></audio>
  <audio id="sfx-success" preload="auto"></audio>
  <audio id="sfx-error" preload="auto"></audio>
  <audio id="sfx-click" preload="auto"></audio>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/scene.js"></script>
</body>

</html>
